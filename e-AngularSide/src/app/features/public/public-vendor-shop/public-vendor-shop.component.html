<div class="container py-5" *ngIf="vendor">

  <div class="card border-0 shadow-sm mb-5">

    <img
      *ngIf="vendor.bannerUrl"
      [src]="vendor.bannerUrl"
      class="card-img-top"
      style="height:260px;object-fit:cover;">

    <div class="card-body text-center">

      <img
        *ngIf="vendor.logoUrl"
        [src]="vendor.logoUrl"
        class="rounded-circle border"
        width="110"
        height="110">

      <h2 class="mt-3">

        {{vendor.shopName}}

      </h2>

      <p class="text-muted">

        {{vendor.description}}

      </p>

      <div>

        ⭐ {{vendor.rating || 0}}

      </div>

    </div>

  </div>

  <div class="row">

    <div
      class="col-xl-3 col-lg-4 col-md-6 mb-4"
      *ngFor="let product of products">

      <app-product-card

        [product]="product"

        (wishlist)="handleWishlist(product)"

        (cart)="handleCart(product)"

        (view)="openProduct(product.id)"

        (review)="writeReview(product.id)">

      </app-product-card>

    </div>

  </div>

</div>
