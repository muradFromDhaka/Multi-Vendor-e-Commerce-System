<section class="featured-section py-5">

  <div class="container">


    <!-- Section Header -->
    <div class="section-header text-center mb-5">

      <h2>
        Featured Products
      </h2>

      <p>
        Discover our latest and popular products
      </p>

    </div>



    <!-- Loading -->
    <div
      class="text-center py-5"
      *ngIf="loading">

      <div class="spinner-border text-dark"></div>

      <p class="mt-3">
        Loading products...
      </p>

    </div>



    <!-- Product List -->

    <div
      class="row g-4"
      *ngIf="!loading && products.length > 0">


      <div
        class="col-xl-3 col-lg-4 col-md-6"
        *ngFor="let product of products">


        <app-product-card
          [product]="product">
        </app-product-card>


      </div>


    </div>




    <!-- Empty State -->

    <div
      class="text-center py-5"
      *ngIf="!loading && products.length === 0">


      <h5>
        No products found
      </h5>


    </div>



    <!-- View All Button -->

    <div
      class="text-center mt-5"
      *ngIf="products.length > 0">


      <button
        class="btn btn-outline-dark px-4">

        View All Products

      </button>


    </div>


  </div>


</section>
