<section class="featured-section py-5">


<div class="container">


<div class="section-header text-center mb-5">


<h2>
Featured Products
</h2>


<p class="text-muted">
Discover our most popular products
</p>


</div>





<!-- Loading -->

<div 
class="text-center"
*ngIf="loading">


<div class="spinner-border"></div>


</div>





<!-- Products -->


<div

class="row g-4"

*ngIf="!loading && products.length > 0">





<div

class="col-xl-3 col-lg-4 col-md-6"

*ngFor="let product of products">


<app-product-card

[product]="product"

(wishlist)="handleWishlist($event)"

(cart)="handleCart($event)"

(view)="openProduct($event)"

(review)="writeReview($event)">

</app-product-card>


</div>




</div>





<!-- Empty -->

<div

class="text-center"

*ngIf="!loading && products.length === 0">


<p class="text-muted">

No featured products available

</p>


</div>



</div>


</section>
