<!-- hero-banner.component.html -->
<section class="hero">
  <!-- Background Image with Overlay -->
  <div class="hero-background">
    <img
      [src]="baseImageUrl + banners[currentBanner]?.imageUrl"
      [alt]="banners[currentBanner]?.title"
      class="hero-bg-image"
    />
    <div class="hero-overlay"></div>
  </div>

  <!-- Content -->
  <div class="container">
    <!-- h-100 REMOVE KORUN -->
    <div class="row align-items-center hero-content">  <!-- h-100 remove -->
      <div class="col-lg-8 mx-auto text-center hero-text">
        <div class="hero-text-inner">
          <span class="hero-badge">🔥 New Collection</span>
          <h1 class="display-1 fw-bold">
            {{ banners[currentBanner]?.title }}
          </h1>
          <p class="lead">
            {{ banners[currentBanner]?.subtitle }}
          </p>
          <div class="hero-actions">
            <a
              class="btn btn-primary btn-lg px-5 py-3 rounded-pill shadow-lg"
              [routerLink]="banners[currentBanner]?.buttonLink">
              {{ banners[currentBanner]?.buttonText }}
              <i class="bi bi-arrow-right ms-2"></i>
            </a>
            <button class="btn btn-outline-light btn-lg rounded-pill px-4">
              <i class="bi bi-play-circle me-2"></i> Watch Now
            </button>
          </div>
          <div class="hero-stats d-flex gap-5 justify-content-center mt-5">
            <div><span class="fw-bold display-6">12K+</span> <span class="text-light">Products</span></div>
            <div><span class="fw-bold display-6">4.9★</span> <span class="text-light">Rating</span></div>
            <div><span class="fw-bold display-6">99%</span> <span class="text-light">Satisfaction</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Navigation Arrows -->
  <button class="slider-btn prev" (click)="previousBanner()" aria-label="Previous slide">
    <i class="bi bi-chevron-left"></i>
  </button>
  <button class="slider-btn next" (click)="nextBanner()" aria-label="Next slide">
    <i class="bi bi-chevron-right"></i>
  </button>

  <!-- Dots / Indicators -->
  <div class="dots">
    <span
      *ngFor="let banner of banners; let i = index"
      [class.active]="i === currentBanner"
      (click)="goToBanner(i)"
      [attr.aria-label]="'Go to slide ' + (i+1)"
    ></span>
  </div>
</section>
