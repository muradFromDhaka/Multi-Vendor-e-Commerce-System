<section class="deals-section py-5">

  <div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">

      <div>

        <h2>🔥 Today's Deals</h2>

        <p class="text-muted">
          Best discounts for today
        </p>

      </div>

    </div>

    <div
      class="row"
      *ngIf="!loading">

      <div
        class="col-xl-3 col-lg-4 col-md-6 mb-4"
        *ngFor="let product of deals">

        <app-product-card
  [product]="product"
  (wishlist)="handleWishlist(product)"
  (cart)="handleCart(product)"
  (view)="openProduct(product.id)"
  (review)="writeReview(product.id)">
</app-product-card>

      </div>

    </div>

    <div
      class="text-center py-5"
      *ngIf="loading">

      Loading deals...

    </div>

  </div>

</section>
