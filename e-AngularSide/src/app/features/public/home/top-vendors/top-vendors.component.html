<section class="top-vendors-section py-5">


<div class="container">


<!-- Header -->

<div class="section-header mb-5">


<div>

<h2>
Top Vendors 🏪
</h2>


<p>
Explore trusted sellers
</p>


</div>


<button
class="btn btn-outline-dark">

View All Vendors

</button>


</div>





<!-- Vendor Cards -->


<div
class="row g-4"
*ngIf="!loading">



<div

class="col-xl-3 col-lg-4 col-md-6"

*ngFor="let vendor of vendors">



<div class="vendor-card">



<img

[src]="vendor.logoUrl"

class="vendor-image">





<h5>

{{vendor.shopName}}

</h5>




<div class="rating">


<i class="bi bi-star-fill"></i>


{{vendor.rating}}


</div>





<p>

{{vendor.totalProducts}} Products

</p>





<button
(click)="openVendorShop(vendor.id)"
class="btn btn-dark w-100">


View Shop


</button>




</div>



</div>



</div>



</div>


</section>
