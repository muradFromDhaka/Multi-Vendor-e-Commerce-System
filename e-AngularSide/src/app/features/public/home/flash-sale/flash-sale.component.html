<section class="flash-sale">

    <div class="container">

        <div class="section-header">

            <div>

                <h2>⚡ Flash Sale</h2>

                <p>Limited Time Deals</p>

            </div>

            <div class="timer">

                <span>{{hours | number:'2.0'}}</span>

                :

                <span>{{minutes | number:'2.0'}}</span>

                :

                <span>{{seconds | number:'2.0'}}</span>

            </div>

        </div>

        <div
            class="row"
            *ngIf="!loading">

            <div
                class="col-lg-3 col-md-6 mb-4"
                *ngFor="let deal of deals">

                <div class="deal-card">

                    <div class="discount-badge">

                        -{{deal.discountPercent}}%

                    </div>

                    <img
                        [src]="baseImageUrl+ deal.productImage"
                        class="product-image">

                    <div class="card-body">

                        <h5>

                            {{deal.productName}}

                        </h5>

                        <p>

                            {{deal.title}}

                        </p>

                        <button
                            [routerLink]="['/publicProductView',deal.productId]"
                            class="btn btn-danger btn-sm">

                            Shop Now

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <div
            class="text-center py-5"
            *ngIf="loading">

            Loading Deals...

        </div>

    </div>

</section>
