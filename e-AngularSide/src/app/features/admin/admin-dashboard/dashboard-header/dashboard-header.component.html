<div class="dashboard-header mb-4">

    <div class="row align-items-center g-3">

        <!-- Left -->

        <div class="col-lg-8">

            <h2 class="dashboard-title">

                Admin Dashboard

            </h2>

            <p class="dashboard-subtitle">

                Monitor marketplace performance, revenue,
                orders, customers and business analytics.

            </p>

        </div>

        <!-- Right -->

        <div class="col-lg-4">

            <div class="d-flex justify-content-lg-end">

                <select
                        class="form-select dashboard-filter"
                        [(ngModel)]="selectedRange">

                    <option
                            *ngFor="let item of dateRanges"
                            [value]="item.value">

                        {{item.label}}

                    </option>

                </select>

            </div>

        </div>

    </div>

</div>
