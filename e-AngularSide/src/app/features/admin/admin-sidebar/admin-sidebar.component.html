<div

    <!-- Logo -->

        <!-- <span>Admin Panel</span> -->

    </div>

    <div class="menu-group">

        <a

        </a>

    </div>

    <!-- ================= CATALOG ================= -->

    <div class="menu-group">

            routerLinkActive="active">

        <a

            routerLinkActive="active">

        </a>

        <a

            <span class="icon">👥</span>

        </a>

        <a
            routerLink="/admin/roles"
            routerLinkActive="active">

            <span class="icon">🔐</span>

        <h4>SALES</h4>

    <div class="menu-group">

        <h4>MARKETING</h4>

        <a

            <span class="title">Banners</span>

        <a

            routerLinkActive="active">

            <span class="icon">🔥</span>
            <span class="title">Deals</span>

        </a>

    </div>

    <div class="menu-group">

        <a>

            <span class="icon">📈</span>
